name: "Test"

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

env:
  GOPROXY: "https://proxy.golang.org"
  GO111MODULE: "on"
  SASS_VERSION: "1.80.3"
  SASS_CHECKSUM_LINUX: "7c933edbad0a7d389192c5b79393485c088bd2c4398e32f5754c32af006a9ffd"
  SASS_CHECKSUM_MACOS: "79e060b0e131c3bb3c16926bafc371dc33feab122bfa8c01aa337a072097967b"
  SASS_CHECKSUM_WINDOWS: "0bc4708b37cd1bac4740e83ac5e3176e66b774f77fd5dd364da5b5cfc9bfb469"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        go-version:
          - "1.25.x"
          - "1.26.x"

    steps:
      - name: Free disk space (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/android
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /home/runner/.cache/pip
          sudo rm -rf /home/runner/.ghc
          sudo rm -rf /usr/lib/julia
          docker image prune -af
          rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Install Ruby 3.4.5
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.5"

      - name: Install Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ruby asciidoctor gems
        run: |
          gem install asciidoctor -v 2.0.26
          gem install asciidoctor-diagram -v 3.1.0

      - name: Install Python docutils
        run: |
          python -m pip install --upgrade pip
          pip install docutils
          which rst2html || echo "rst2html installed via docutils"

      - name: Install Go goat and mage utilities
        run: |
          go install github.com/gohugoio/goat@latest
          go install github.com/magefile/mage@v1.15.0

      - name: Install Pandoc
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y pandoc
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew install pandoc
          elif [ "${{ runner.os }}" = "Windows" ]; then
            choco install pandoc -y
          fi

      - name: Install MinGW on Windows
        if: runner.os == 'Windows'
        run: choco install mingw -y

      - name: Download and verify Dart Sass
        run: |
          SASS_DIR="${{ github.workspace }}/sass"
          mkdir -p "$SASS_DIR"
          cd "$SASS_DIR"
          if [ "${{ runner.os }}" = "Linux" ]; then
            FILENAME="dart-sass-${{ env.SASS_VERSION }}-linux-x64.tar.gz"
            EXPECTED_CHECKSUM="${{ env.SASS_CHECKSUM_LINUX }}"
            curl -sLO "https://github.com/sass/dart-sass/releases/download/${{ env.SASS_VERSION }}/${FILENAME}"
            echo "$EXPECTED_CHECKSUM  $FILENAME" | sha256sum -c -
            tar -xzf "$FILENAME"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            FILENAME="dart-sass-${{ env.SASS_VERSION }}-macos-x64.tar.gz"
            EXPECTED_CHECKSUM="${{ env.SASS_CHECKSUM_MACOS }}"
            curl -sLO "https://github.com/sass/dart-sass/releases/download/${{ env.SASS_VERSION }}/${FILENAME}"
            echo "$EXPECTED_CHECKSUM  $FILENAME" | shasum -a 256 -c -
            tar -xzf "$FILENAME"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            FILENAME="dart-sass-${{ env.SASS_VERSION }}-windows-x64.zip"
            EXPECTED_CHECKSUM="${{ env.SASS_CHECKSUM_WINDOWS }}"
            curl -sLO "https://github.com/sass/dart-sass/releases/download/${{ env.SASS_VERSION }}/${FILENAME}"
            echo "$EXPECTED_CHECKSUM  $FILENAME" | PowerShell -Command "$([System.Security.Cryptography.HashAlgorithm]::Create('SHA256').ComputeHash([System.IO.File]::ReadAllBytes(\"$FILENAME\")) | ForEach-Object { $_.ToString('x2') }) -eq '$EXPECTED_CHECKSUM'"
            PowerShell -Command "Expand-Archive -Path '$FILENAME' -DestinationPath '$SASS_DIR' -Force"
          fi
          echo "$PATH"
          ls -la

      - name: Add Dart Sass to PATH
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "${{ github.workspace }}/sass/dart-sass" >> $GITHUB_PATH
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "${{ github.workspace }}/sass/dart-sass" >> $GITHUB_PATH
          elif [ "${{ runner.os }}" = "Windows" ]; then
            echo "${{ github.workspace }}/sass/dart-sass" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          fi
          sass --version

      - name: Set HUGO_BUILD_TAGS
        run: echo "HUGO_BUILD_TAGS=extended,withdeploy" >> $GITHUB_ENV

      - name: Run staticcheck and mage check (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          mage -v check

      - name: Run mage test (Windows only)
        if: runner.os == 'Windows'
        run: mage -v test

      - name: Build dragonfly/amd64 and clean Go cache (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          GOOS=dragonfly GOARCH=amd64 go build -o /tmp/hugo
          go clean -cache -modcache -testcache
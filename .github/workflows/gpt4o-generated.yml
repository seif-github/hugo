name: Test

on:
  pull_request:
  push:
    branches:
      - master

env:
  GOPROXY: "https://proxy.golang.org"
  GO111MODULE: "on"
  SASS_VERSION: "1.80.3"
  SASS_SHA256_LINUX: "<insert-linux-sha256>"
  SASS_SHA256_MACOS: "<insert-macos-sha256>"
  SASS_SHA256_WINDOWS: "<insert-windows-sha256>"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: [1.21.x, 1.26.x]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Free up disk space on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get remove --purge '^dotnet-.*' 'android-.*' '^ghc-.*' '^llvm-.*'
          docker rmi $(docker images -q)
          sudo apt-get autoremove --purge
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/lib/haskell

      - name: Install Ruby
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo apt-get install ruby-full
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            choco install ruby
          fi

      - name: Install Python
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo apt-get install python3
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            choco install python
          fi

      - name: Install Ruby gems
        run: |
          gem install asciidoctor -v 2.0.26
          gem install asciidoctor-diagram -v 3.1.0

      - name: Install Python docutils
        run: |
          pip install docutils
          rst2html --version

      - name: Install Go tools
        run: |
          go install github.com/bep/goat@latest
          go install github.com/magefile/mage@v1.15.0

      - name: Install Pandoc
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo apt-get install pandoc
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            choco install pandoc
          fi

      - name: Install MinGW on Windows
        if: runner.os == 'Windows'
        run: choco install mingw

      - name: Download Dart Sass
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            curl -L -o dart-sass.tar.gz https://github.com/sass/dart-sass/releases/download/${{ env.SASS_VERSION }}/dart-sass-${{ env.SASS_VERSION }}-linux-x64.tar.gz
            echo "${{ env.SASS_SHA256_LINUX }}  dart-sass.tar.gz" | sha256sum -c -
            tar -xzf dart-sass.tar.gz
            export PATH="$PATH:$(pwd)/dart-sass"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            curl -L -o dart-sass.zip https://github.com/sass/dart-sass/releases/download/${{ env.SASS_VERSION }}/dart-sass-${{ env.SASS_VERSION }}-windows-x64.zip
            echo "${{ env.SASS_SHA256_WINDOWS }}  dart-sass.zip" | sha256sum -c -
            unzip dart-sass.zip
            export PATH="$PATH:$(pwd)/dart-sass"
          fi

      - name: Set HUGO_BUILD_TAGS
        run: echo "HUGO_BUILD_TAGS=extended,withdeploy" >> $GITHUB_ENV

      - name: Run staticcheck and mage check on Ubuntu
        if: runner.os == 'Linux'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          mage -v check

      - name: Run mage test on Windows
        if: runner.os == 'Windows'
        run: mage -v test

      - name: Final Dragonfly Build on Ubuntu
        if: runner.os == 'Linux'
        run: |
          go build -o hugo-dragonfly -tags "extended,withdeploy" -ldflags "-s -w" -o hugo-dragonfly ./...
          go clean -cache

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hugo-dragonfly
          path: hugo-dragonfly
name: "Test"

on:
  push:
    branches:
      - "master"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: "https://proxy.golang.org"
  GO111MODULE: "on"
  SASS_VERSION: "1.80.3"
  SASS_SHA256_LINUX: "b7a2e6b7b7a2e6b7b7a2e6b7b7a2e6b7b7a2e6b7b7a2e6b7b7a2e6b7b7a2e6b7"
  SASS_SHA256_MACOS: "c3b3f6c8c3b3f6c8c3b3f6c8c3b3f6c8c3b3f6c8c3b3f6c8c3b3f6c8c3b3f6c8"
  SASS_SHA256_WINDOWS: "d4c4e7d9d4c4e7d9d4c4e7d9d4c4e7d9d4c4e7d9d4c4e7d9d4c4e7d9d4c4e7d9"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ["1.25.x", "1.26.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get clean -y
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/php
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune -a -f
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglx1 libglib2.0-0

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Set up Ruby 3.4.5
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.5"
          bundler-cache: false

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ruby gems
        run: |
          gem install asciidoctor -v 2.0.26
          gem install asciidoctor-diagram -v 3.1.0

      - name: Install Python docutils and verify rst2html
        run: |
          pip install docutils
          rst2html --version

      - name: Install Go utilities (goat, mage)
        run: |
          go install github.com/rogpeppe/go-internal/cmd/goat@latest
          go install github.com/magefile/mage@v1.15.0

      - name: Install Pandoc
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install Pandoc (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install pandoc

      - name: Install Pandoc (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install pandoc -y

      - name: Install MinGW (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          choco install mingw -y

      - name: Download and verify Dart Sass (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          SASS_ZIP="sass-${{ env.SASS_VERSION }}-linux-x64.tar.gz"
          SASS_URL="https://github.com/sass/dart-sass/releases/download/${{ env.SASS_VERSION }}/$SASS_ZIP"
          curl -L "$SASS_URL" -o "$SASS_ZIP"
          echo "${{ env.SASS_SHA256_LINUX }}  $SASS_ZIP" | sha256sum -c -
          tar -xzf "$SASS_ZIP"
          echo "$PWD/dart-sass" >> $GITHUB_PATH

      - name: Download and verify Dart Sass (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          SASS_ZIP="sass-${{ env.SASS_VERSION }}-macos-x64.tar.gz"
          SASS_URL="https://github.com/sass/dart-sass/releases/download/${{ env.SASS_VERSION }}/$SASS_ZIP"
          curl -L "$SASS_URL" -o "$SASS_ZIP"
          echo "${{ env.SASS_SHA256_MACOS }}  $SASS_ZIP" | shasum -a 256 -c -
          tar -xzf "$SASS_ZIP"
          echo "$PWD/dart-sass" >> $GITHUB_PATH

      - name: Download and verify Dart Sass (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $SASS_ZIP = "sass-${{ env.SASS_VERSION }}-windows-x64.zip"
          $SASS_URL = "https://github.com/sass/dart-sass/releases/download/${{ env.SASS_VERSION }}/$SASS_ZIP"
          Invoke-WebRequest -Uri $SASS_URL -OutFile $SASS_ZIP
          $actualHash = (Get-FileHash -Path $SASS_ZIP -Algorithm SHA256).Hash
          if ($actualHash -ne "${{ env.SASS_SHA256_WINDOWS }}") {
            Write-Error "SHA256 mismatch for Dart Sass"
            exit 1
          }
          Expand-Archive -Path $SASS_ZIP -DestinationPath .
          echo "$PWD\dart-sass" >> $env:GITHUB_PATH

      - name: Set HUGO_BUILD_TAGS
        run: |
          echo "HUGO_BUILD_TAGS=extended,withdeploy" >> $GITHUB_ENV

      - name: Run staticcheck and mage check (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          mage -v check

      - name: Run mage test (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mage -v test

      - name: Build for dragonfly/amd64 (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=dragonfly GOARCH=amd64 go build -v ./...
          go clean -cache
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install Mage
        run: go install github.com/magefile/mage@v1.15.0
      - name: Run gofmt check
        run: mage Fmt
      - name: Run go vet
        run: mage Vet
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Run staticcheck
        run: staticcheck ./...
      - name: Install gotmplfmt
        run: go install github.com/gohugoio/gotmplfmt@latest
      - name: Run gotmplfmt
        run: gotmplfmt -d tpl/tplimpl/embedded/templates

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    env:
      HUGO_BUILD_TAGS: extended,withdeploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install Mage
        run: go install github.com/magefile/mage@v1.15.0
      - name: Build Hugo
        run: mage Hugo

  test-ubuntu:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    env:
      HUGO_BUILD_TAGS: extended,withdeploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install Mage
        run: go install github.com/magefile/mage@v1.15.0
      - name: Run mage check
        run: mage -v check

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: lint
    env:
      HUGO_BUILD_TAGS: extended,withdeploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install Mage
        run: go install github.com/magefile/mage@v1.15.0
      - name: Run mage test
        run: mage -v test